name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install protoc plugins
      run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest && go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Generate protobuf
      run: make proto

    - name: Build
      run: go build -v ./...

    - name: Unit tests
      run: go test ./pkg/suggestions/... ./pkg/agent/... ./pkg/dnstransport/... ./server/approval/... ./server/listeners/... -v -count=1

    - name: E2E tests
      run: go test ./server/e2e/... -v -count=1

    - name: Build agent
      run: make agent